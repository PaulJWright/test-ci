# Copy to .github/workflows/gh200-tests.yml in your repo, and ci/gh200.sh beside it.
#
# Phase 1 (now): dispatch: manual. Start the runner from your laptop with
#   tools/dispatch-runner.sh --watch OWNER/REPO
# Phase A (dev): dispatch: mvp, with the two secrets and the BRICS_CI_URL variable.
name: GH200 tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gh200:
    uses: PaulJWright/brics-ci/.github/workflows/gh200.yml@v0
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      dispatch: manual
      # image: ubuntu:24.04                # run the script in a container instead
    # secrets:                             # dispatch: mvp only
    #   origin-token: ${{ secrets.BRICS_CI_ORIGIN_TOKEN }}
    #   runner-admin-pat: ${{ secrets.RUNNER_ADMIN_PAT }}

  # The same script, in a container image
  gh200-image:
    uses: PaulJWright/brics-ci/.github/workflows/gh200.yml@v0
    with:
      profile: gh200-1gpu
      script: ci/gh200.sh
      image: ubuntu:24.04
      dispatch: manual
