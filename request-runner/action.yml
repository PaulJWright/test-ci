name: BriCS CI request runner
description: >-
  Asks BriCS CI to start a runner on Isambard-AI for this run's GH200 job. Runs on
  GitHub's own runner, in gh200.yml's request job, or in your own workflow (the
  advanced form).
inputs:
  dispatch:
    description: "mvp (dev, Phase A) or service (Phase B)"
    required: true
  profile:
    description: Resources on Isambard-AI, for example gh200-1gpu
    required: true
  origin-token:
    description: The repo's BriCS CI origin token
    required: true
  runner-admin-pat:
    description: "dispatch: mvp only. A fine-grained PAT for this repo with Administration: write"
    required: false
    default: ""
  url:
    description: The BriCS CI job API, for example vars.BRICS_CI_URL
    required: true
  launcher:
    description: Where launch-runner.sh lives on the cluster
    required: false
    default: /opt/brics-ci/launcher/launch-runner.sh
outputs:
  release-url:
    description: Where to release this run
    value: ${{ steps.request.outputs.release-url }}
runs:
  using: composite
  steps:
    - id: request
      shell: bash
      env:
        DISPATCH: ${{ inputs.dispatch }}
        PROFILE: ${{ inputs.profile }}
        ORIGIN_TOKEN: ${{ inputs.origin-token }}
        GH_TOKEN: ${{ inputs.runner-admin-pat }}
        URL: ${{ inputs.url }}
        LAUNCHER: ${{ inputs.launcher }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: '"$GITHUB_ACTION_PATH/request.sh"'
